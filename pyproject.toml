[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tentorch"
version = "0.1.0"
description = "Block-sparse tensor networks: MPS, MPO, the DMRG sweep, the symmetry behind them, and the Gaussian fermion states built on the same pieces"
requires-python = ">=3.12"
dependencies = ["torch"]

[tool.setuptools.packages.find]
where = ["."]
namespaces = true
include = ["tentorch*"]
exclude = ["tentorch.*.cuda.build*"]

[tool.setuptools.package-data]
tentorch = ["**/*.cpp", "**/*.h", "**/*.pyi"]
"tentorch.linalg.freefermion.cuda" = ["*.cu"]
"tentorch.algorithms.cgo.cuda" = ["*.cu"]
