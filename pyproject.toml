[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tentorch"
version = "0.1.0"
description = "free-fermion, Gaussian tensor network and CGO routines of this repository"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
namespaces = true
include = ["FreeFermion*", "CGO*", "tentorch*"]
exclude = ["FreeFermion.cuda.build*", "CGO.cuda.build*", "*.notebooks*"]

[tool.setuptools.package-data]
tentorch = ["**/*.cpp", "**/*.h", "**/*.pyi"]
"FreeFermion.cuda" = ["*.cu"]
"CGO.cuda" = ["*.cu"]
