[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tentorch"
version = "0.1.0"
description = "free-fermion, Gaussian tensor network and CGO routines of this repository"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["."]
namespaces = true
include = ["tentorch*"]
exclude = ["tentorch.*.cuda.build*", "tentorch.*.notebooks*"]

[tool.setuptools.package-data]
tentorch = ["**/*.cpp", "**/*.h", "**/*.pyi"]
"tentorch.linalg.freefermion.cuda" = ["*.cu"]
"tentorch.algorithms.cgo.cuda" = ["*.cu"]
